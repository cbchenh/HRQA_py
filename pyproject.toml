[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrqa"
version = "0.1.0"
description = "Heterogeneous Recurrence Quantification Analysis (Python port of MATLAB HRQA toolkit)"
authors = [{ name = "Cheng-Bang Chen" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "numba>=0.56",
    "joblib>=1.2",
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0"]
dev = ["pytest>=7", "line_profiler"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hrqa*"]
